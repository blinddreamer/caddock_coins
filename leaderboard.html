<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="3600">
  <title>Caddock Coins — Leaderboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d1117; color: #e6e6e6; font-family: 'Segoe UI', sans-serif; min-height: 100vh; padding: 40px 20px; }
    h1 { text-align: center; color: #f1c40f; font-size: 2rem; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 8px; }
    .subtitle { text-align: center; color: #555; font-size: 0.85rem; margin-bottom: 40px; }
    table { width: 100%; max-width: 600px; margin: 0 auto; border-collapse: collapse; }
    thead tr { border-bottom: 2px solid #f1c40f; }
    th { color: #f1c40f; text-align: left; padding: 12px 16px; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; }
    th:last-child { text-align: right; }
    td { padding: 14px 16px; border-bottom: 1px solid #1a2030; }
    tbody tr:hover { background: #1a2030; }
    .rank { color: #888; font-size: 0.9rem; display: inline-block; min-width: 32px; }
    .rank.gold { color: #f1c40f; }
    .rank.silver { color: #c0c0c0; }
    .rank.bronze { color: #cd7f32; }
    .name { font-weight: 500; }
    .points { color: #f1c40f; font-weight: bold; text-align: right; }
  </style>
</head>
<body>
  <h1>🏆 Leaderboard</h1>
  <p class="subtitle">Refreshes every hour · Top 25</p>
  <table>
    <thead><tr><th>Rank</th><th>Pilot</th><th>Coins</th></tr></thead>
    <tbody>{{ROWS}}</tbody>
  </table>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="3600">
  <title>D-SCO Coins · Leaderboard</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="https://d-sco.rocks/styles.css" />
  <style>
    .content {
      position: relative;
      z-index: 1;
      top: 35%;
      left: 2rem;
      max-width: 640px;
    }

    .subtitle {
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #aaa;
      margin-top: 0.4rem;
      margin-left: 15px;
    }

    /* ── TABLE ── */
    .card {
      margin-top: 2rem;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 4px;
      overflow: hidden;
    }

    table { width: 100%; border-collapse: collapse; }

    thead tr { border-bottom: 1px solid rgba(255, 255, 255, 0.08); }

    th {
      color: #aaa;
      text-align: left;
      padding: 14px 22px;
      font-size: 0.65rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: normal;
    }
    th:last-child { text-align: right; }

    tbody tr {
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      transition: background 0.15s ease;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(255, 255, 255, 0.04); }

    td { padding: 13px 22px; }

    .rank {
      display: inline-block;
      width: 26px;
      text-align: center;
      font-size: 0.85rem;
      color: #444;
      letter-spacing: 1px;
    }

    .rank.gold   { color: #c8a85a; }
    .rank.silver { color: #a0a0a0; }
    .rank.bronze { color: #a0602a; }

    .name {
      font-size: 0.9rem;
      color: #ccc;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .points-cell { text-align: right; }

    .points {
      font-size: 0.9rem;
      color: white;
      letter-spacing: 1.5px;
    }
  </style>
</head>
<body>

  <div id="loader"><span>D-SCO</span></div>
  <div id="dots"></div>

  <nav class="navbar">
    <div class="nav-links">
      <a href="https://d-sco.rocks" class="purifier-link">
        <img src="https://d-sco.rocks/assets/purifier.png" alt="Purifier" class="purifier-icon" />
      </a>
      <span id="doh">|</span>
      <a href="https://d-sco.rocks/">Home</a>
      <span id="doh">|</span>
      <a href="https://auth.d-sco.rocks/">Auth</a>
      <span id="doh">|</span>
      <a href="https://wiki.d-sco.rocks/">Wiki</a>
      <span id="doh">|</span>
      <a href="https://d-sco.rocks/news">News</a>
      <span id="doh">|</span>
      <a href="https://leaderboard.d-sco.rocks/">Leaderboard</a>
      <span id="doh">|</span>
      <a href="https://zkillboard.com/corporation/98519746/">Zkill</a>
    </div>
  </nav>

  <video autoplay muted loop id="bg-video">
    <source src="https://d-sco.rocks/assets/bg.mp4" type="video/mp4" />
  </video>

  <div class="content">
    <h1>Leaderboard</h1>
    <p class="subtitle">Refreshes every hour &middot; Top 25</p>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Pilot</th>
            <th>Coins</th>
          </tr>
        </thead>
        <tbody>{{ROWS}}</tbody>
      </table>
    </div>
  </div>

  <div id="dots"></div>
  <footer class="footer">
    <p>&copy; d-sco.rocks</p>
    <p>EVE and related materials are trademarks of <a href="https://www.ccpgames.com/">CCP hf</a></p>
  </footer>

  <script>
    window.addEventListener('load', () => {
      const loader = document.getElementById('loader');
      loader.classList.add('loader-hide');
      loader.addEventListener('transitionend', () => loader.remove());
    });
  </script>

</body>
</html>
